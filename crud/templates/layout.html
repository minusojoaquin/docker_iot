<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECTITRACK - Panel Gerente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --background: #ffffff;
            --foreground: #030213;
            --card: #ffffff;
            --primary: #030213;
            --muted: #ececf0;
            --muted-foreground: #717182;
            --accent: #e9ebef;
            --destructive: #d4183d;
            --border: rgba(0, 0, 0, 0.1);
            --radius: 0.625rem;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .bg-rectitrack {
            background-color: var(--primary);
        }

        .card-custom {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background-color: var(--card);
            transition: background-color 0.2s;
        }

        .card-custom:hover {
            background-color: var(--accent);
        }

        .btn-primary-custom {
            background-color: var(--primary);
            color: white;
            border-radius: var(--radius);
        }

        .btn-primary-custom:hover {
            background-color: #1a1929;
            color: white;
        }

        .alert-custom {
            background-color: var(--muted);
            color: var(--foreground);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand bg-white py-3" style="border-bottom: 1px solid rgba(0, 0, 0, 0.05);">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-dark d-flex align-items-center m-0" href="{{ url_for('panel_gerente') }}" style="font-size: 1.1rem; letter-spacing: -0.02em;">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo RectiTrack" height="40" class="me-2"> RECTITRACK
            </a>
            {% if session.get('role') == 'gerente' %}
            <div class="d-flex align-items-center gap-3">
                <span class="navbar-text text-secondary small font-monospace p-0">MODO GERENTE</span>
                <a href="{{ url_for('logout') }}" class="text-secondary d-flex align-items-center" aria-label="Cerrar sesión" style="transition: color 0.2s;">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                </a>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-custom alert-dismissible fade show small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.75rem;"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
