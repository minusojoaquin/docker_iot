{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-shield-lock me-2 text-primary"></i>Recuperar Contraseña</h3>
                <p class="text-muted text-center mb-4">Ingresa tu correo electrónico y te enviaremos una contraseña temporal para que puedas acceder a tu cuenta.</p>
                <form action="{{ url_for('recuperar_contrasena') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="tu@email.com" value="{{ request.form.get('email', '') }}">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-envelope me-2"></i>Enviar Contraseña</button>
                    </div>
                    <div class="mt-3 text-center">
                        <a href="{{ url_for('login') }}" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left me-1"></i> Volver al Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
