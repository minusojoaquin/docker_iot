{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center mt-5" style="max-width: 100%;">
    <div class="col-md-12">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo RectiTrack" height="180" class="mb-2">
            <small class="text-white-50 d-block">Recuperación de Acceso</small>
        </div>

        <div class="card shadow border-0 p-3" style="background-color: #1A365D; border-radius: 1rem; color: #ffffff; max-width: 400px; margin: 0 auto;">
            <div class="card-body">
                <h4 class="text-center fw-bold mb-1 text-white">Recuperar Contraseña</h4>
                <p class="text-center small text-white-50 mb-4">Ingrese su usuario/email para recibir un enlace de recuperación.</p>

                <form action="{{ url_for('recuperar_password') }}" method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label small fw-bold text-white">USUARIO O EMAIL</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 text-white" style="background-color: rgba(255,255,255,0.1);"><i class="bi bi-envelope"></i></span>
                            <input type="text" class="form-control text-white border-0" style="background-color: rgba(255,255,255,0.05);" name="email" id="email" placeholder="Ingrese su usuario" required>
                        </div>
                    </div>

                    <button type="submit" class="btn w-100 py-2 fw-bold mb-3" style="background-color: #FF6B00; color: #ffffff; border-radius: 0.5rem;">Enviar Enlace</button>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('login') }}" class="text-white-50 text-decoration-none small">Volver al login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
