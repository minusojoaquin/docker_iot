{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center mt-5" style="max-width: 100%;">
    <div class="col-md-12">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo RectiTrack" height="80" class="mb-2">
            <h3 class="fw-bold mt-2">RECTITRACK</h3>
            <small class="text-muted">Gestión de Motores con Precisión Digital</small>
        </div>

        <div class="card shadow border-0 p-3" style="background-color: #162a45; border-radius: 1rem; color: #ffffff;">
            <div class="card-body">
                <h4 class="text-center fw-bold mb-1">Registrar Cuenta</h4>
                <p class="text-center small text-white-50 mb-4">Crear cuenta de Gerente en RectiTrack</p>

                <form action="{{ url_for('registrar') }}" method="POST">
                    <!-- Forzar el rol de gerente -->
                    <input type="hidden" name="rol" value="gerente">

                    <div class="mb-3">
                        <label for="usuario" class="form-label small fw-bold">USUARIO</label>
                        <div class="input-group">
                            <span class="input-group-text bg-secondary border-0 text-white"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control bg-dark text-white border-0" name="usuario"
                                id="usuario" placeholder="Ingrese nuevo usuario" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-bold">CONTRASEÑA</label>
                        <div class="input-group">
                            <span class="input-group-text bg-secondary border-0 text-white"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control bg-dark text-white border-0" name="password"
                                id="password" placeholder="Ingrese contraseña" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold mb-3"
                        style="border-radius: 0.5rem; color: #162a45;">Registrar Usuario</button>
                    
                    <div class="text-center my-3 border-top border-secondary pt-3">
                        <a href="{{ url_for('login') }}" class="text-warning text-decoration-none small fw-bold">Volver al Iniciar Sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
