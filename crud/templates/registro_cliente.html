{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="mb-4">
            <h2 class="fw-bold text-dark mb-1" style="font-size: 1.5rem; letter-spacing: -0.02em;">Ingreso de Motor</h2>
            <p class="text-secondary small">Paso 1: Identificación o registro del cliente</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs-custom d-flex">
            <button type="button" id="tab-existente" class="nav-link-custom active w-50 text-center" onclick="switchTab('existente')">
                Cliente Existente
            </button>
            <button type="button" id="tab-nuevo" class="nav-link-custom w-50 text-center" onclick="switchTab('nuevo')">
                Nuevo Cliente
            </button>
        </div>

        <div class="card shadow-sm border-0 p-4 bg-white" style="border-radius: 0.75rem;">
            <form action="{{ url_for('registro_cliente') }}" method="POST">

                <!-- DNI — shared by both tabs -->
                <div class="mb-3">
                    <label for="dni" class="form-label">DNI DEL CLIENTE</label>
                    <input type="number" class="form-control" name="dni" id="dni"
                           placeholder="Ej: 38449122" required>
                    <div class="form-text">Ingrese el DNI sin espacios ni puntos.</div>
                </div>

                <!-- Hidden flag: new vs existing client -->
                <input type="hidden" name="es_nuevo" id="es_nuevo" value="false">

                <!-- New Client Fields (conditionally shown) -->
                <div id="new-client-container" style="display: none;">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="nombre" class="form-label">NOMBRE</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                   placeholder="Nombre">
                        </div>
                        <div class="col-6">
                            <label for="apellido" class="form-label">APELLIDO</label>
                            <input type="text" class="form-control" id="apellido" name="apellido"
                                   placeholder="Apellido">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="telefono" class="form-label">TELÉFONO</label>
                            <input type="text" class="form-control" id="telefono" name="telefono"
                                   placeholder="+54 9 376 4123456">
                        </div>
                        <div class="col-6">
                            <label for="email" class="form-label">EMAIL</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary-orange py-2">
                        Guardar y Continuar <i class="bi bi-chevron-right ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', function () {
        switchTab('existente');
    });

    function switchTab(mode) {
        var tabExistente       = document.getElementById('tab-existente');
        var tabNuevo           = document.getElementById('tab-nuevo');
        var newClientContainer = document.getElementById('new-client-container');
        var esNuevoInput       = document.getElementById('es_nuevo');
        var newFields          = ['nombre', 'apellido', 'telefono', 'email'];

        if (mode === 'existente') {
            tabExistente.classList.add('active');
            tabNuevo.classList.remove('active');
            newClientContainer.style.display = 'none';
            esNuevoInput.value = 'false';
            newFields.forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.removeAttribute('required');
            });
        } else {
            tabExistente.classList.remove('active');
            tabNuevo.classList.add('active');
            newClientContainer.style.display = 'block';
            esNuevoInput.value = 'true';
            newFields.forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.setAttribute('required', 'required');
            });
        }
    }
</script>
{% endblock %}
