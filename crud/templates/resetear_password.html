{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center mt-5" style="max-width: 100%;">
    <div class="col-md-12">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo RectiTrack" height="180" class="mb-2">
            <small class="text-white-50 d-block">Seguridad de Acceso</small>
        </div>

        <div class="card shadow border-0 p-3" style="background-color: #1A365D; border-radius: 1rem; color: #ffffff; max-width: 400px; margin: 0 auto;">
            <div class="card-body">
                <h4 class="text-center fw-bold mb-1 text-white">Restablecer Contraseña</h4>
                <p class="text-center small text-white-50 mb-4">Ingrese su nueva contraseña.</p>

                <form action="{{ url_for('resetear_password', token=token) }}" method="POST" id="resetForm">
                    <div class="mb-3">
                        <label for="nueva_password" class="form-label small fw-bold text-white">NUEVA CONTRASEÑA</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 text-white" style="background-color: rgba(255,255,255,0.1);"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control text-white border-0" style="background-color: rgba(255,255,255,0.05);" name="nueva_password" id="nueva_password" placeholder="Nueva contraseña" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmar_password" class="form-label small fw-bold text-white">CONFIRMAR CONTRASEÑA</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 text-white" style="background-color: rgba(255,255,255,0.1);"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control text-white border-0" style="background-color: rgba(255,255,255,0.05);" name="confirmar_password" id="confirmar_password" placeholder="Confirmar contraseña" required>
                        </div>
                        <div id="passwordMismatch" class="form-text text-danger d-none mt-2 small">Las contraseñas no coinciden.</div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn w-100 py-2 fw-bold mb-3" style="background-color: #FF6B00; color: #ffffff; border-radius: 0.5rem;" disabled>Guardar Contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const nuevaPassword = document.getElementById('nueva_password');
    const confirmarPassword = document.getElementById('confirmar_password');
    const submitBtn = document.getElementById('submitBtn');
    const mismatchWarning = document.getElementById('passwordMismatch');

    function validatePasswords() {
        if (nuevaPassword.value === "" || confirmarPassword.value === "") {
            submitBtn.disabled = true;
            mismatchWarning.classList.add('d-none');
            return;
        }

        if (nuevaPassword.value === confirmarPassword.value) {
            submitBtn.disabled = false;
            mismatchWarning.classList.add('d-none');
        } else {
            submitBtn.disabled = true;
            mismatchWarning.classList.remove('d-none');
        }
    }

    nuevaPassword.addEventListener('input', validatePasswords);
    confirmarPassword.addEventListener('input', validatePasswords);
});
</script>
{% endblock %}
